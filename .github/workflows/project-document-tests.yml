name: Project document tests

on:
  push:
    paths:
      - 'src/editor/ProjectDocument.*'
      - 'src/repak/thirdparty/rapidjson/**'
      - 'tests/**'
      - '.github/workflows/project-document-tests.yml'
  pull_request:
    paths:
      - 'src/editor/ProjectDocument.*'
      - 'src/repak/thirdparty/rapidjson/**'
      - 'tests/**'
      - '.github/workflows/project-document-tests.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run regression tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc -isystem src/repak/thirdparty \
            tests/ProjectDocumentTests.cpp src/editor/ProjectDocument.cpp -o "$RUNNER_TEMP/project-document-tests"
          "$RUNNER_TEMP/project-document-tests"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run regression tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /W4 /Isrc /Isrc\repak\thirdparty tests\ProjectDocumentTests.cpp src\editor\ProjectDocument.cpp /Fe:"%RUNNER_TEMP%\project-document-tests.exe"
          if errorlevel 1 exit /b 1
          "%RUNNER_TEMP%\project-document-tests.exe"
